<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CineApp - Reserva de entradas</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Pantalla 1: Selección de película -->
    <section id="screen-movies">
      <header class="app-header">
        <h1>CineApp</h1>
      </header>

      <main>
        <div id="movies-grid" class="movies-grid" aria-live="polite">
          <!-- Las tarjetas de películas se renderizan desde script.js -->
        </div>
      </main>
    </section>

    <!-- Pantalla 2: Selección de horario -->
    <section id="screen-showtimes" style="display:none;">
      <header class="app-header">
        <button id="btn-back-to-movies" type="button">← Volver</button>
        <h2 id="showtimes-title">Seleccionar horario</h2>
      </header>

      <main class="showtimes-main">
        <div class="selected-movie">
          <img id="selected-movie-poster" src="" alt="Poster película" />
          <div class="selected-movie-info">
            <h3 id="selected-movie-title"></h3>
          </div>
        </div>

        <section id="showtimes-list" class="showtimes-list" aria-label="Horarios disponibles">
          <!-- Botones de horarios se renderizan desde script.js -->
        </section>

        <div class="actions">
          <button id="btn-continue" type="button" disabled>Continuar</button>
        </div>
      </main>
    </section>

    <!-- Pantalla 3: Cantidad de entradas + resumen -->
    <section id="screen-summary" style="display:none;">
      <header class="app-header">
        <button id="btn-back-to-showtimes" type="button">← Volver</button>
        <h2>Resumen de reserva</h2>
      </header>

      <main class="summary-main">
        <div class="selected-movie summary-movie">
          <img id="summary-movie-poster" src="" alt="Poster película" />
          <div class="selected-movie-info">
            <h3 id="summary-movie-title"></h3>
            <div id="summary-showtime" class="sub"></div>
          </div>
        </div>

        <div class="quantity-control">
          <label for="ticket-quantity">Cantidad de entradas</label>
          <div class="qty-controls">
            <button id="qty-decrease" type="button" aria-label="Disminuir">−</button>
            <input id="ticket-quantity" type="number" min="1" value="1" />
            <button id="qty-increase" type="button" aria-label="Aumentar">+</button>
          </div>
        </div>

        <div class="live-summary">
          <p>Película: <strong id="summary-movie-title-2"></strong></p>
          <p>Horario: <strong id="summary-showtime-2"></strong></p>
          <p>Cantidad: <strong id="summary-quantity"></strong></p>
          <p>Precio por entrada: <strong id="summary-unit-price">$3000</strong></p>
          <p>Total: <strong id="summary-total"></strong></p>
        </div>

        <div class="actions">
          <button id="btn-confirm-reservation" type="button">Confirmar reserva</button>
        </div>
      </main>
    </section>

    <!-- Pantalla 4: Mensaje de éxito -->
    <section id="screen-success" style="display:none;">
      <h1>Compra exitosa</h1>
    </section>

    <script src="script.js" defer></script>
  </body>
</html>
